general {
    no_fade_in = true
    no_fade_out = true
    disable_loading_bar = false
    hide_cursor = true
    immediate_render = true
}

background {
    monitor =
    color = rgb(0, 0, 0)
}

label {
    monitor =
    text = cmd[update:1000] echo -e "$(date +"%A, %B %d - %I:%M")"
    color = rgb(200, 200, 200)
    font_size = 15
    position = 0, -40
    halign = center
    valign = top
}

shape {
    monitor =
    size = 500, 100
    color = rgba(0, 0, 0, 0)
    rounding = 0
    border_size = 2
    border_color = rgba(255, 255, 255, 1)
    rotate = 0
    position = 0, 0
    halign = center
    valign = center
}

shape {
    monitor =
    size = 200, 20
    color = rgb(0, 0, 0)
    rounding = 0
    border_size = 2
    border_color = rgb(0, 0, 0)
    rotate = 0
    position = -130, 50
    halign = center
    valign = center
    zindex = 5
}

label {
    monitor =
    text = Authenticate into nixos
    color = rgba(216, 222, 233, 0.80)
    font_size = 11
    position = -130, 50
    halign = center
    valign = center
    zindex = 5
}

label {
    monitor =
    text = <b>Username: $USER</b>
    color = rgba(216, 222, 233, 0.80)
    font_size = 11
    position = -167, 15
    halign = center
    valign = center
    zindex = 1
}

label {
    monitor =
