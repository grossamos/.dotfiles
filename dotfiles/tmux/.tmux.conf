# ~/.tmux.conf

# ── Prefix ───────────────────────────────────────────────────────────────────
set -g prefix C-b
bind C-b send-prefix

# ── Core ─────────────────────────────────────────────────────────────────────
set -g extended-keys on
set -g extended-keys-format csi-u
set -g escape-time 5
set -g history-limit 50000
set -g mouse on
set -g base-index 1
set -g pane-base-index 1
set -g renumber-windows on
set -g focus-events on

# ── True color ────────────────────────────────────────────────────────────────
set -g default-terminal "tmux-256color"
set -as terminal-features ",xterm-256color:RGB"
set -as terminal-features ",tmux-256color:RGB"
set -as terminal-features ",alacritty*:RGB"
set -as terminal-features ",ghostty*:RGB"
set -as terminal-features ",foot*:RGB"

# ── Vi mode ───────────────────────────────────────────────────────────────────
set -g mode-keys vi
bind Escape copy-mode                                        # nicer entry than prefix-[
bind -T copy-mode-vi v   send-keys -X begin-selection
bind -T copy-mode-vi C-v send-keys -X rectangle-toggle
bind -T copy-mode-vi y   send-keys -X copy-selection-and-cancel
# C-u / C-d half-page scroll are vi defaults and work out of the box

# ── Splits & windows (open in current dir) ───────────────────────────────────
bind |   split-window -h -c "#{pane_current_path}"
bind -   split-window -v -c "#{pane_current_path}"
bind '"' split-window -v -c "#{pane_current_path}"
bind %   split-window -h -c "#{pane_current_path}"
bind c   new-window      -c "#{pane_current_path}"

# ── Pane navigation (Alt+hjkl, no prefix) ────────────────────────────────────
bind -n M-h select-pane -L
bind -n M-j select-pane -D
bind -n M-k select-pane -U
bind -n M-l select-pane -R

# ── Pane navigation (prefix + hjkl) ──────────────────────────────────────────
bind h select-pane -L
bind j select-pane -D
bind k select-pane -U
bind l select-pane -R

# ── Reload ────────────────────────────────────────────────────────────────────
bind r source-file ~/.tmux.conf \; display "tmux.conf reloaded"

# ── Catppuccin Mocha palette ──────────────────────────────────────────────────
base="#1e1e2e"
surface0="#313244"
surface1="#45475a"
overlay0="#6c7086"
subtext0="#a6adc8"
text="#cdd6f4"
blue="#89b4fa"

# ── Status bar ────────────────────────────────────────────────────────────────
set -g status on
set -g status-position bottom
set -g status-interval 5
set -g status-style "bg=${base},fg=${text}"

# Left: session name — mirrors your nvim mode block
set -g status-left "#[bg=${blue},fg=${base},bold]  #{session_name} #[bg=${base},fg=${blue}]"
set -g status-left-length 40

# Right: time
set -g status-right "#[fg=${overlay0}] %H:%M  %d %b "
set -g status-right-length 24

# Windows: inactive dim, active blue
set -g window-status-separator ""
set -g window-status-format         "#[bg=${base},fg=${overlay0}]  #I #[fg=${subtext0}]#W  "
set -g window-status-current-format "#[bg=${base},fg=${surface0}]#[bg=${surface0},fg=${blue},bold] #I #[fg=${text}]#W #[bg=${base},fg=${surface0}]"

# Pane borders — active thicker + brighter
set -g pane-border-lines heavy
set -g pane-border-style        "fg=${surface0}"
set -g pane-active-border-style "fg=${blue},bold"

# Dim inactive panes so active one pops
set -g window-style        "fg=${subtext0},bg=${base}"
set -g window-active-style "fg=${text},bg=default"

# Command/message bar
set -g message-style "bg=${surface0},fg=${blue}"

# ── Plugins (TPM) ─────────────────────────────────────────────────────────────
set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'tmux-plugins/tmux-sensible'
set -g @plugin 'tmux-plugins/tmux-yank'

run '~/.tmux/plugins/tpm/tpm'
