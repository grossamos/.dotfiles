# hypridle config
# based on https://github.com/hyprwm/hypridle/blob/main/assets/example.conf

general {
    ignore_dbus_inhibit = false

    lock_cmd = pidof hyprlock || hyprlock       # avoid starting multiple hyprlock instances
    before_sleep_cmd = loginctl lock-session    # lock before suspend
    after_sleep_cmd = hyprctl dispatch dpms on  # to avoid having to press a key twice to turn on the display
}

listener {
    timeout = 300                               # 5min
    on-timeout = loginctl lock-session          # lock the screen
}

listener {
    timeout = 330                               # 5.5min
    on-timeout = hyprctl dispatch dpms off      # screen off
    on-resume = hyprctl dispatch dpms on        # screen on when activity is detected
}

listener {
    timeout = 1800                              # 30min
    on-timeout = systemctl suspend              # suspend the pc
}
